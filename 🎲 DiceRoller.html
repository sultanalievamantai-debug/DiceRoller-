<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            background: rgb(0, 112, 0);
            color: rgb(255, 255, 255);
            text-align: center;
            padding-top: 40px;
            font-family: sans-serif;
        }
        #dice {
            font-size: 140px;
            margin: 20px 0;
        }
        button {
            padding: 12px 20px;
            font-size: 18px;
            cursor: pointer;
            margin: 5px;
        }
        #history {
            font-size: 18px;
            opacity: 0.85;
        }
    </style>
</head>
<body>
    <h1>🎲 Бросок кубика</h1>
    <div id="dice">🎲</div>
    <button id="rollDice">Бросить</button>
    <button id="resetGame">Сбросить</button>
    <p id="info">Нажми "Бросить"</p>
    <p id="history"></p>

    <script>
       let dice = document.getElementById('dice')
       let rollDice = document.getElementById('rollDice')
       let resetGame = document.getElementById('resetGame')
       let info = document.getElementById('info')
       let historyEl = document.getElementById('history')
       let faces = ['⚀', '⚁', '⚂', '⚃', '⚄', '⚅'];
       let history = [];
       let total = 0;

       rollDice.onclick = function() {
        // Получаем случайное число от 1 до 6:
        // Math.random() * 6 → от 0 до 5.999...
        // Math.floor(...)   → 0, 1, 2, 3, 4 или 5
        // + 1               → 1, 2, 3, 4, 5 или 6
        let number = Math.floor(Math.random() * 6) + 1
        dice.textContent = faces[number - 1]
        history.push(number)
        total += number
        info.textContent = `Выпало: ${number} | Бросоков: ${history.length} | Сумма: ${total}`
        historyEl.textContent = 'История: ' + history.join(', ')
       }

       resetGame.onclick = function() {
        history = []
        total = 0
        dice.textContent = '🎲'
        info.textContent = 'Нажми "Бросить"'
        historyEl.textContent = ''
       }
    </script>
</body>
</html>
